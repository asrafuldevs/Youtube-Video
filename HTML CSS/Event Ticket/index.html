<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Event Ticket</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="ticket">
            <div class="ticket-left">
                <span class="ticket-tag">MUSIC FESTIVAL</span>
                <h1 class="event-title">Summer Beats Live 2026</h1>

                <section class="info-row">
                    <div class="info-box">
                        <div class="info-label">Date</div>
                        <div class="info-value">22 Nov 2026</div>
                    </div>

                    <div class="info-box">
                        <div class="info-label">Time</div>
                        <div class="info-value">7:00 PM</div>
                    </div>

                    <div class="info-box">
                        <div class="info-label">Gate</div>
                        <div class="info-value">84</div>
                    </div>
                </section>

                <section class="info-box">
                    <div class="info-label">Venue</div>
                    <div class="info-value">Central Park, Dhaka</div>
                </section>

                <div class="barcode"></div>
            </div>

            <div class="ticket-divider"></div>

            <section class="ticket-right">
                <div class="seat-label">Seat</div>
                <div class="seat-value">A-24</div>
                <div class="ticket-icon">🎫</div>
            </section>
        </main>
    </body>
</html>
