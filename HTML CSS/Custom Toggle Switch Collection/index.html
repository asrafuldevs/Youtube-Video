<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Custom Toggle Switch Collection</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="container">
            <h2>Toggle Switches</h2>
            <p class="subtitle">6 custom styles with pure CSS</p>

            <section class="grid">
                <section class="item">
                    <label class="switch classic">
                        <input type="checkbox" />
                        <span class="slider"></span>
                    </label>
                    <span>Classic</span>
                </section>

                <section class="item">
                    <label class="switch square">
                        <input type="checkbox" />
                        <span class="slider"></span>
                    </label>
                    <span>Square</span>
                </section>

                <section class="item">
                    <label class="switch daynight">
                        <input type="checkbox" />
                        <span class="slider"></span>
                    </label>
                    <span>Day / Night</span>
                </section>

                <section class="item">
                    <label class="switch text">
                        <input type="checkbox" />
                        <span class="slider"></span>
                    </label>
                    <span>ON / OFF</span>
                </section>

                <section class="item">
                    <label class="switch neon">
                        <input type="checkbox" />
                        <span class="slider"></span>
                    </label>
                    <span>Neon Glow</span>
                </section>

                <section class="item">
                    <label class="switch stretch">
                        <input type="checkbox" />
                        <span class="slider"></span>
                    </label>
                    <span>Gradient</span>
                </section>
            </section>
        </main>
    </body>
</html>
