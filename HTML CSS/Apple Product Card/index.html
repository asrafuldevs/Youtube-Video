<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Apple Product Card</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="product-card">
            <div class="top">
                <div class="brand">APPLE</div>
                <div class="heart">♡</div>
            </div>
            <div class="product-image">
                <div class="badge">NEW ARRIVAL</div>
                <div class="circle"></div>
                <img src="/image.png" alt="Airpods Pro 3 Image" class="" />
            </div>
            <div class="content">
                <div class="category">Premium Collection</div>
                <h2 class="title">AirPods Pro 3</h2>
                <p class="descripation">
                    Minimal design, premium finish and smart technology designed
                    for your everyday lifestyle.
                </p>
                <div class="bottom">
                    <div class="price">
                        $239.99
                        <span class="old-price">$249.99</span>
                    </div>
                    <button class="buy-btn">Add to Cart</button>
                </div>
                <div class="rating">
                    <div class="stars">★★★★★</div>
                    <span>4.9 (125 reviews)</span>
                </div>
            </div>
        </main>
    </body>
</html>
