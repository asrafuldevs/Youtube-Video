<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather App UI</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="weather-card">
            <section class="location-row">
                <div>
                    <div class="location-name">Dhaka, Bangladesh</div>
                    <div class="location-date">Friday, 16 Oct</div>
                </div>
                <div>📍</div>
            </section>

            <section class="weather-icon">
                <div class="sun"></div>
                <div class="cloud"></div>
            </section>

            <section class="temp-main">
                <span class="temp-value">31°</span>
            </section>

            <section class="temp-condition">Partly Cloudy</section>

            <section class="stats-row">
                <div class="stat-item">
                    <div class="stat-label">Humidity</div>
                    <div class="stat-value">64%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Wind</div>
                    <div class="stat-value">12 km/h</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">UV Index</div>
                    <div class="stat-value">Medium</div>
                </div>
            </section>

            <section class="forecast-row">
                <div class="forecast-day">
                    <div class="day-name">Sat</div>
                    <div class="day-icon">☀️</div>
                    <div class="day-temp">33°</div>
                </div>
                <div class="forecast-day">
                    <div class="day-name">Sun</div>
                    <div class="day-icon">⛅</div>
                    <div class="day-temp">30°</div>
                </div>
                <div class="forecast-day">
                    <div class="day-name">Mon</div>
                    <div class="day-icon">🌧️</div>
                    <div class="day-temp">27°</div>
                </div>
                <div class="forecast-day">
                    <div class="day-name">Tue</div>
                    <div class="day-icon">⛅</div>
                    <div class="day-temp">29°</div>
                </div>
            </section>
        </main>
    </body>
</html>
