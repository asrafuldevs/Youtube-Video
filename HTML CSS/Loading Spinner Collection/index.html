<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Loading Spinner Collection</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="wrapper">
            <h1 class="heading">Loading Spinner Collection</h1>

            <div class="grid">
                <div class="card">
                    <div class="ring"></div>
                    <span class="label">Spinning Ring</span>
                </div>

                <div class="card">
                    <div class="dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="label">Bouncing Dots</span>
                </div>

                <div class="card">
                    <div class="pulse"></div>
                    <span class="label">Pulse Circle</span>
                </div>

                <div class="card">
                    <div class="bars">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span> </span>
                        <span> </span>
                    </div>
                    <span class="label">Growing Bars</span>
                </div>

                <div class="card">
                    <div class="dual-ring"></div>
                    <span class="label">Dual Ring</span>
                </div>

                <div class="card">
                    <div class="square"></div>
                    <span class="label">Square Rotate</span>
                </div>

                <div class="card">
                    <div class="circle-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="label">Fading Dots Circle</span>
                </div>

                <div class="card">
                    <div class="progress-track">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="label">Sliding Progress Bar</span>
                </div>
            </div>
        </main>
    </body>
</html>
