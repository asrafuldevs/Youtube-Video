<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Premium Product Card</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="product-card">
            <!-- product badge -->
            <div class="badge">Hot Release</div>
            <!-- product image -->
            <div class="product-image">
                <img src="/image.png" alt="Nike Sneaker" />
            </div>
            <!-- product details -->
            <div class="product-details">
                <span class="product-category">Men's Running Shoes</span>
                <h3 class="product-title">Nike Air Max 270</h3>
                <p class="product-description">
                    Experience maximum comfort with this premium quality running
                    shoe. Stylish design for your everyday look.
                </p>
                <div class="product-bottom">
                    <div class="product-price">
                        <span class="new-price">$120</span>
                        <span class="old-price">$150</span>
                    </div>
                    <div class="product-actions">
                        <button class="wishlist-btn">❤️</button>
                        <button class="cart-btn">Add to Cart</button>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
