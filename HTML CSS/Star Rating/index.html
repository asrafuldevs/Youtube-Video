<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Star Rating</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <section class="card">
            <h2>Rate Your Experience</h2>
            <p class="subtitle">Tap a star to give your rating</p>

            <section class="box">
                <!-- stars -->
                <section class="rating">
                    <input type="radio" name="rate" id="s5" /><label for="s5"
                        >★</label
                    >
                    <input type="radio" name="rate" id="s4" /><label for="s4"
                        >★</label
                    >
                    <input type="radio" name="rate" id="s3" /><label for="s3"
                        >★</label
                    >
                    <input type="radio" name="rate" id="s2" /><label for="s2"
                        >★</label
                    >
                    <input type="radio" name="rate" id="s1" /><label for="s1"
                        >★</label
                    >
                </section>

                <!-- messages -->
                <section class="message">
                    <div class="default">No rating yet</div>
                    <div class="m1"><span>😡</span>Terrible</div>
                    <div class="m2"><span>😕</span>Bad</div>
                    <div class="m3"><span>😐</span>Okay</div>
                    <div class="m4"><span>🙂</span>Good</div>
                    <div class="m5"><span>😍</span>Excellent</div>
                </section>
            </section>
        </section>
    </body>
</html>
