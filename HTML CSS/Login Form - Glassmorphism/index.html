<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login Form - Glassmorphism</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="login-card">
            <div class="login-icon">🔒</div>
            <div class="login-title">Welcome Back</div>
            <div class="login-subtext">Login to continue to your account</div>

            <section class="input-group">
                <label for="" class="input-label">Email Address</label>
                <input type="email" placeholder="you@example.com" />
            </section>

            <section class="input-group">
                <label for="" class="input-label">Password</label>
                <input type="password" placeholder="Enter your password" />
            </section>

            <section class="form-options">
                <label class="remember-me">
                    <input type="checkbox" />
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password</a>
            </section>

            <button class="login-btn">Log In</button>

            <section class="signup-text">
                Don't have an account? <a href="#">Sing Up</a>
            </section>
        </main>
    </body>
</html>
