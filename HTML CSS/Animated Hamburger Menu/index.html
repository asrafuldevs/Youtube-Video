<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Animated Hamburger Menu</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="demo-wrapper">
            <label>
                <input type="checkbox" class="menu-toggle" />

                <div class="hamburger-box">
                    <div class="hamburger-icon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </label>
            <div class="label-text">
                Click the icon to see it<br />transform into a close (X) icon
            </div>
        </main>
    </body>
</html>
