<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OTP Verification Page</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <section class="card">
            <div class="icon">🔐</div>
            <h2>Verify Your Account</h2>
            <p>
                We sent a 6-digit code to <strong>user@example.com</strong>.
                <br />
                Enter it below to continue.
            </p>

            <!-- 6 boxes -->

            <section class="otp" id="otp">
                <input
                    type="text"
                    maxlength="1"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder=" "
                />
                <input
                    type="text"
                    maxlength="1"
                    inputmode="numeric"
                    placeholder=" "
                />
                <input
                    type="text"
                    maxlength="1"
                    inputmode="numeric"
                    placeholder=" "
                />
                <input
                    type="text"
                    maxlength="1"
                    inputmode="numeric"
                    placeholder=" "
                />
                <input
                    type="text"
                    maxlength="1"
                    inputmode="numeric"
                    placeholder=" "
                />
                <input
                    type="text"
                    maxlength="1"
                    inputmode="numeric"
                    placeholder=" "
                />
            </section>

            <button class="verify-btn" id="verify">Verify</button>

            <p class="resend">Didn't get the code? <a href="#">Resend</a></p>
        </section>

        <script src="/script.js"></script>
    </body>
</html>
