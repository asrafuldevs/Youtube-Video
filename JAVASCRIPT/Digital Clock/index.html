<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Digital Clock</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <main class="clock-card">
            <p class="greeting" id="greeting">Good night</p>
            <div class="time" id="time" aria-live="polite">09 : 12 : 45</div>
            <p class="date" id="date">Sunday, 27 September 2026</p>
            <div class="divider"></div>
            <button class="format-toggle" id="toggle" type="button">
                Switch to 24H
            </button>
        </main>

        <script src="/script.js"></script>
    </body>
</html>
